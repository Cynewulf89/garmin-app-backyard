name: Release Build Selected Devices

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device:
          - fr945
          - fenix6
          - enduro
          - epix2pro51mm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Developer Key
        run: echo "${{ secrets.DEVELOPER_KEY_BASE64 }}" | base64 --decode > ./developer_key.der

      - name: Build PRG for ${{ matrix.device }}
        uses: blackshadev/garmin-connectiq-build-action@9.2.0
        with:
          projectJungle: ./monkey.jungle
          developerKey: ./developer_key.der
          outputPath: ./bin/backyard-${{ matrix.device }}.prg
          device: ${{ matrix.device }}
          typeCheck: '0'

      - name: Upload PRG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prg-${{ matrix.device }}
          path: ./bin/backyard-${{ matrix.device }}.prg

  build-iq:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Developer Key
        run: echo "${{ secrets.DEVELOPER_KEY_BASE64 }}" | base64 --decode > ./developer_key.der

      - name: Build Store IQ Package
        uses: blackshadev/garmin-connectiq-build-action@9.2.0
        with:
          projectJungle: ./monkey.jungle
          developerKey: ./developer_key.der
          outputPath: ./bin/backyard.iq
          device: fr945
          extraArgs: '-e'
          typeCheck: '0'

      - name: Upload IQ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iq-package
          path: ./bin/backyard.iq

  release:
    needs: [build, build-iq]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all built PRGs
        uses: actions/download-artifact@v4
        with:
          path: ./all-prgs
          merge-multiple: true

      - name: Download IQ Package
        uses: actions/download-artifact@v4
        with:
          name: iq-package
          path: ./all-iq

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./all-prgs/*.prg
            ./all-iq/*.iq
          generate_release_notes: true
